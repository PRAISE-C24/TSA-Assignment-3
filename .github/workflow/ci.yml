name: CI Pipeline

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bash Executable Permissions
        run: chmod +x scripts/lint.sh tests/test.sh scripts/build.sh app/app.sh

      - name: Run Linting Checks
        run: ./scripts/lint.sh

  test:
    name: Run Unit Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bash Executable Permissions
        run: chmod +x scripts/lint.sh tests/test.sh scripts/build.sh app/app.sh

      - name: Run Test Suite
        run: ./tests/test.sh

  docker:
    name: Build & Smoke Test Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Bash Executable Permissions
        run: chmod +x scripts/lint.sh tests/test.sh scripts/build.sh app/app.sh

      - name: Run Build and Smoke Tests
        run: ./scripts/build.sh